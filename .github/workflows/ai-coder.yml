name: OpenRouter AI Auto Coder
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install aider-chat
          git config user.name "AI-Bot"
          git config user.email "bot@://github.com"
          BR="ai-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b "$BR"
          aider --model openrouter/meta-llama/llama-3.3-70b-instruct:free --edit-format whole --yes-always --no-auto-commits --message "${{ github.event.issue.title }}: ${{ github.event.issue.body }}"
          git add .
          git commit -m "AI #${{ github.event.issue.number }}"
          git push -u origin "$BR"
          gh pr create --head "$BR" --base main --title "AI: ${{ github.event.issue.title }}" --body "Done"
