name: OpenRouter AI Auto Coder

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and Run Aider with OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install aider-chat
          git config user.name "AI-Developer-Bot"
          git config user.email "bot@users.noreply.github.com"
          
          BRANCH_NAME="ai-task-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"

          # 使用 OpenRouter 官方自動免費路由，永遠自動挑選可用嘅頂級免費模型
          aider --model openrouter/openrouter/free \
                --yes-always \
                --no-auto-commits \
                --message "${{ github.event.issue.title }}: ${{ github.event.issue.body }}"

          git add .
          git commit -m "AI Task #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" || echo "No changes"
          git push -u origin "$BRANCH_NAME"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="ai-task-${{ github.event.issue.number }}-${{ github.run_id }}"
          gh pr create \
            --head "$BRANCH_NAME" \
            --base main \
            --title "AI 自動實作: ${{ github.event.issue.title }}" \
            --body "AI 已根據 Issue #${{ github.event.issue.number }} 自動完成編碼，請直接按 Merge pull request 觸發雲端編譯 iOS IPA。"
