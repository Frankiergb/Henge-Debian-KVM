name: HengeDebian
options:
  bundleIdPrefix: com.frankiergb
  deploymentTarget:
    iOS: "16.0"
targets:
  HengeDebian:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - ".github/**"
          - "*.md"
          - "*.yml"
          - ".gitignore"
          - ".aider*"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankiergb.HengeDebian
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
